name: Send AppLink listing email

# Email hello@miniapplink.online from the CHV VPS (direct SMTP to MX).
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NEW_SSH }}

      - name: Send listing email from VPS (direct MX)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          NEW_PASS: ${{ secrets.NEW_PASS }}
        run: |
          set -euo pipefail
          HOST="${SSH_HOST:?}"
          USER_="${SSH_USER:?}"
          PORT="${SSH_PORT:-22}"
          SSH=(ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          SCP=(scp -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)

          printf '%s\n' "$NEW_PASS" > /tmp/chv-sudo.pass
          "${SCP[@]}" docs/_applink-email-chv.txt /tmp/chv-sudo.pass "${USER_}@${HOST}:/tmp/"

          "${SSH[@]}" "${USER_}@${HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          SUDO() { sudo -S -p '' "$@" < /tmp/chv-sudo.pass; }
          cleanup() { rm -f /tmp/chv-sudo.pass /tmp/_applink-email-chv.txt /tmp/send_applink.py /tmp/applink-body.txt; }
          trap cleanup EXIT

          # Drop broken bounce queue from earlier postfix attempts
          if command -v postsuper >/dev/null 2>&1; then
            SUDO postsuper -d ALL || true
          fi

          BODY=$(awk 'NR==1 && /^To:/{next} NR==2 && /^Subject:/{next} NR==3 && /^$/{next} {print}' /tmp/_applink-email-chv.txt)
          printf '%s\n' "$BODY" > /tmp/applink-body.txt

          cat > /tmp/send_applink.py <<'PY'
          #!/usr/bin/env python3
          import socket
          import smtplib
          import sys
          from email.message import EmailMessage
          from pathlib import Path

          TO = "hello@miniapplink.online"
          FROM_addr = "catalog@chv.blc.cab"
          subject = "List Mini App: CHV DAO Cabinet (@bulgaria_state_bot)"
          body = Path("/tmp/applink-body.txt").read_text(encoding="utf-8")

          msg = EmailMessage()
          msg["From"] = f"CHV Catalog <{from_addr}>"
          msg["To"] = TO
          msg["Reply-To"] = from_addr
          msg["Subject"] = subject
          msg.set_content(body)

          # MX name has no A record (NXDOMAIN); SPF advertises the real MTA IP.
          hosts = ["144.124.251.27", "mail.miniapplink.online"]
          print(f"hosts={hosts}", flush=True)

          last_err = None
          for host in hosts:
            for port in (25, 587, 465):
              try:
                print(f"try {host}:{port}", flush=True)
                if port == 465:
                  with smtplib.SMTP_SSL(host, port, timeout=25) as s:
                    s.ehlo("chv.blc.cab")
                    s.send_message(msg)
                else:
                  with smtplib.SMTP(host, port, timeout=25) as s:
                    s.ehlo("chv.blc.cab")
                    if port == 587:
                      try:
                        s.starttls()
                        s.ehlo("chv.blc.cab")
                      except smtplib.SMTPException as e:
                        print(f"starttls_skip: {e}", flush=True)
                    s.send_message(msg)
                print(f"SENT via {host}:{port}", flush=True)
                sys.exit(0)
              except Exception as e:
                last_err = e
                print(f"fail {host}:{port}: {type(e).__name__}: {e}", flush=True)

          print(f"ALL_FAILED last={last_err}", flush=True)
          sys.exit(1)
          PY

          python3 /tmp/send_applink.py
          REMOTE
