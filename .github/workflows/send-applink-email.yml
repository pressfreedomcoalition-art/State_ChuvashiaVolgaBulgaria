name: Send AppLink listing email

# Email hello@miniapplink.online from the CHV VPS (direct SMTP to SPF MTA IP).
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # DO VPS blocks outbound SMTP (25/465 timeout). Send from Actions runner instead.
      - name: Send listing email (Actions runner → AppLink MTA)
        run: |
          set -euo pipefail
          awk 'NR==1 && /^To:/{next} NR==2 && /^Subject:/{next} NR==3 && /^$/{next} {print}' \
            docs/_applink-email-chv.txt > /tmp/applink-body.txt
          python3 scripts/send-applink-email.py /tmp/applink-body.txt
