name: Send AppLink listing email

# One-shot: email hello@miniapplink.online from the CHV VPS.
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NEW_SSH }}

      - name: Send listing email from VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          NEW_PASS: ${{ secrets.NEW_PASS }}
        run: |
          set -euo pipefail
          HOST="${SSH_HOST:?}"
          USER_="${SSH_USER:?}"
          PORT="${SSH_PORT:-22}"
          SSH=(ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          SCP=(scp -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)

          printf '%s\n' "$NEW_PASS" > /tmp/chv-sudo.pass
          "${SCP[@]}" docs/_applink-email-chv.txt /tmp/chv-sudo.pass "${USER_}@${HOST}:/tmp/"

          "${SSH[@]}" "${USER_}@${HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          SUDO() { sudo -S -p '' "$@" < /tmp/chv-sudo.pass; }
          cleanup() { rm -f /tmp/chv-sudo.pass /tmp/_applink-email-chv.txt /tmp/applink-body.txt /tmp/applink.eml; }
          trap cleanup EXIT

          export DEBIAN_FRONTEND=noninteractive
          if ! command -v sendmail >/dev/null 2>&1; then
            SUDO apt-get update -qq
            SUDO apt-get install -y -qq mailutils postfix
          fi

          # Fix broken noninteractive postfix install (missing mailname → deferred).
          echo 'chv.blc.cab' | SUDO tee /etc/mailname >/dev/null
          SUDO postconf -e "myhostname=chv.blc.cab"
          SUDO postconf -e "mydomain=chv.blc.cab"
          SUDO postconf -e "myorigin=/etc/mailname"
          SUDO postconf -e "inet_interfaces=loopback-only"
          SUDO postconf -e "inet_protocols=ipv4"
          SUDO systemctl reload postfix || SUDO systemctl restart postfix
          SUDO postsuper -d ALL || true

          BODY=$(awk 'NR==1 && /^To:/{next} NR==2 && /^Subject:/{next} NR==3 && /^$/{next} {print}' /tmp/_applink-email-chv.txt)
          printf '%s\n' "$BODY" > /tmp/applink-body.txt

          FROM='catalog@chv.blc.cab'
          SUBJECT='List Mini App: CHV DAO Cabinet (@bulgaria_state_bot)'
          TO='hello@miniapplink.online'

          echo "mailer: sendmail=$(command -v sendmail)"
          echo "from=$FROM to=$TO"

          {
            printf 'From: CHV Catalog <%s>\n' "$FROM"
            printf 'To: %s\n' "$TO"
            printf 'Reply-To: %s\n' 'catalog@chv.blc.cab'
            printf 'Subject: %s\n' "$SUBJECT"
            printf 'MIME-Version: 1.0\n'
            printf 'Content-Type: text/plain; charset=UTF-8\n'
            printf 'Content-Transfer-Encoding: 8bit\n'
            printf '\n'
            cat /tmp/applink-body.txt
          } | sendmail -t -v 2>&1 | tee /tmp/applink-send.log

          sleep 8
          echo "=== mailq ==="
          SUDO mailq || true
          echo "=== mail.log tail ==="
          SUDO journalctl -u postfix -n 30 --no-pager || true

          if SUDO mailq 2>/dev/null | grep -qi 'Mail queue is empty'; then
            echo "queue_empty_ok"
          elif SUDO journalctl -u postfix -n 40 --no-pager 2>/dev/null | grep -E "to=<${TO}>.*status=sent"; then
            echo "delivered_ok"
          elif SUDO journalctl -u postfix -n 40 --no-pager 2>/dev/null | grep -E "to=<${TO}>.*(deferred|bounced|reject)"; then
            echo "::error::Mail deferred/bounced — DO may block port 25"
            exit 1
          else
            echo "queued_or_unknown — check logs above"
          fi
          REMOTE
