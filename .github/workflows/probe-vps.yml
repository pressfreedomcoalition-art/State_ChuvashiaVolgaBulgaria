name: Probe CHV VPS sudo

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NEW_SSH }}
      - name: Check sudo and ports
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          HOST="${SSH_HOST:?}"
          USER_="${SSH_USER:?}"
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${USER_}@${HOST}" bash -s <<'EOS'
          set -euo pipefail
          echo "user=$(whoami) host=$(hostname)"
          if sudo -n true 2>/dev/null; then
            echo "sudo_ok"
          else
            echo "sudo_FAIL"
            exit 1
          fi
          sudo -n id
          echo "--- listening ---"
          sudo -n ss -lntup | grep -E ':80|:443|:8790' || true
          echo "--- dns from vps ---"
          getent hosts cache.chv.blc.cab || true
          EOS
