name: Check mail queue
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NEW_SSH }}
      - env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          NEW_PASS: ${{ secrets.NEW_PASS }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEW_PASS" > /tmp/p
          scp -P "${SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=accept-new /tmp/p "${SSH_USER}@${SSH_HOST}:/tmp/chv-sudo.pass"
          ssh -p "${SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" bash -s <<'EOS'
          SUDO(){ sudo -S -p '' "$@" </tmp/chv-sudo.pass; }
          echo "=== mailq ==="
          SUDO mailq || true
          echo "=== recent mail.log ==="
          SUDO tail -n 40 /var/log/mail.log 2>/dev/null || SUDO journalctl -u postfix -n 40 --no-pager || true
          rm -f /tmp/chv-sudo.pass
          EOS
