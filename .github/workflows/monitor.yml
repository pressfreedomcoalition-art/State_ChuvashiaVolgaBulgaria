name: Monitor bound domain

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-bound-domain
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify bound domain
        id: prod
        continue-on-error: true
        run: node scripts/verify-bound-domain.mjs 2>&1 | tee /tmp/bound.log

      - name: Bound-domain status
        if: steps.prod.outcome == 'failure'
        run: |
          echo "::warning::Bound domain checks failed — finish votes 33/29/28 and DNS cutover (docs/BOUND_DOMAIN_CHV.md)"
          cat /tmp/bound.log
