name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/monitor.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /
          VITE_PORTAL_ORIGIN: https://chv.blc.cab
          VITE_CIVIC_API: https://dao.won.onl/civic
          VITE_OFFICIAL_UI: https://dao.won.onl
          VITE_CACHE_API: ${{ vars.VITE_CACHE_API }}
          VITE_DAO_ADDRESS: ${{ vars.VITE_DAO_ADDRESS }}
      - name: Smoke test + E2E
        run: |
          npx playwright install chromium
          npx vite preview --host 127.0.0.1 --port 4173 &
          sleep 3
          node scripts/smoke-check.mjs http://127.0.0.1:4173/
          npm run test:e2e -- --project=desktop
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pub.outputs.page_url }}
    steps:
      - id: pub
        uses: actions/deploy-pages@v4
