name: Deploy CHV Telegram bot

# @bulgaria_state_bot — /start → Web App button (chv.blc.cab)
on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "deploy/chv-bot.service"
      - "deploy/install-chv-bot.sh"
      - ".github/workflows/deploy-bot.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require bot token secret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "::error::Add repository secret TELEGRAM_BOT_TOKEN (BotFather → @bulgaria_state_bot)"
            exit 1
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NEW_SSH }}

      - name: Publish bot to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          NEW_PASS: ${{ secrets.NEW_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          HOST="${SSH_HOST:?set secret SSH_HOST}"
          USER_="${SSH_USER:?set secret SSH_USER}"
          PORT="${SSH_PORT:-22}"
          SSH=(ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          SCP=(scp -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)

          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          tar -cf "$TMP/bundle.tar" \
            --exclude=node_modules --exclude=.env \
            -C bot .
          cp deploy/chv-bot.service "$TMP/chv-bot.service"

          umask 077
          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'WEBAPP_URL=%s\n' 'https://chv.blc.cab/'
            printf 'WEBAPP_VERSION=%s\n' '${{ github.sha }}'
            printf 'BUTTON_TEXT=%s\n' 'Открыть гражданство'
            printf 'MENU_BUTTON_TEXT=%s\n' 'Кабинет'
            printf 'START_TEXT=%s\n' 'Кабинет гражданина Чувашии / Волжской Булгарии.\nНажмите кнопку, чтобы открыть миниапп.'
          } >"$TMP/chv-bot.env"
          printf '%s\n' "$NEW_PASS" >"$TMP/chv-sudo.pass"

          "${SCP[@]}" "$TMP/bundle.tar" "$TMP/chv-bot.service" "$TMP/chv-bot.env" "$TMP/chv-sudo.pass" \
            "${USER_}@${HOST}:/tmp/"

          "${SSH[@]}" "${USER_}@${HOST}" /bin/bash <<'REMOTE'
          set -euo pipefail
          SUDO() { sudo -S -p '' "$@" < /tmp/chv-sudo.pass; }
          cleanup() { rm -f /tmp/chv-sudo.pass /tmp/chv-bot.env /tmp/bundle.tar /tmp/chv-bot.service; }
          trap cleanup EXIT

          getent passwd www-data >/dev/null || SUDO useradd -r -s /usr/sbin/nologin www-data
          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | SUDO bash -
            SUDO apt-get install -y nodejs
          fi

          SUDO install -d -o www-data -g www-data /opt/chv-bot
          SUDO tar -xf /tmp/bundle.tar -C /opt/chv-bot
          SUDO install -m 600 -o www-data -g www-data /tmp/chv-bot.env /opt/chv-bot/.env
          SUDO bash -c 'cd /opt/chv-bot && npm ci --omit=dev'
          SUDO chown -R www-data:www-data /opt/chv-bot
          SUDO install -m 644 /tmp/chv-bot.service /etc/systemd/system/chv-bot.service
          SUDO systemctl daemon-reload
          SUDO systemctl enable --now chv-bot.service
          SUDO systemctl restart chv-bot.service
          sleep 2
          SUDO systemctl --no-pager -l is-active chv-bot.service
          SUDO systemctl --no-pager -l status chv-bot.service | head -20
          REMOTE
