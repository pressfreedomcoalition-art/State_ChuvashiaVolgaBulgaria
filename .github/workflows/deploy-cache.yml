name: Deploy CHV cache

# Own VPS as user mish — NO sudo. Frontend stays on GitHub Pages.
# Cache listens on 127.0.0.1:8790; HTTPS via Pinggy SSH tunnel (not Cloudflare).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type OWN_VPS to publish cache-server"
        required: true
        default: ""
  schedule:
    # Free Pinggy tunnels expire ~60m — refresh URL into Pages often
    - cron: "*/40 * * * *"

jobs:
  deploy:
    if: github.event_name == 'schedule' || github.event.inputs.confirm == 'OWN_VPS'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NEW_SSH }}

      - name: Publish user-space cache + HTTPS tunnel
        id: pub
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          HOST="${SSH_HOST:?set secret SSH_HOST}"
          USER_="${SSH_USER:?set secret SSH_USER}"
          PORT="${SSH_PORT:-22}"
          SSH=(ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          SCP=(scp -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)

          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          tar -cf "$TMP/bundle.tar" \
            --exclude=node_modules --exclude=data --exclude=.env \
            -C cache-server .
          cp deploy/user-cache/install-and-run.sh deploy/user-cache/start-user-cache.sh "$TMP/"

          "${SCP[@]}" "$TMP/bundle.tar" "$TMP/install-and-run.sh" "$TMP/start-user-cache.sh" \
            "${USER_}@${HOST}:/tmp/"

          "${SSH[@]}" "${USER_}@${HOST}" /bin/bash <<'REMOTE'
          set -euo pipefail
          chmod +x /tmp/install-and-run.sh /tmp/start-user-cache.sh
          mkdir -p "$HOME/chv-cache"
          cp /tmp/start-user-cache.sh "$HOME/chv-cache/start-user-cache.sh"
          chmod +x "$HOME/chv-cache/start-user-cache.sh"
          /tmp/install-and-run.sh /tmp/bundle.tar
          cat "$HOME/chv-cache/public-url.txt"
          REMOTE

          URL=$("${SSH[@]}" "${USER_}@${HOST}" "cat \$HOME/chv-cache/public-url.txt")
          echo "Cache public URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          curl -fsS --max-time 30 "${URL}/health"
          echo

      - name: Publish cache URL for Pages (runtime JSON)
        env:
          CACHE_URL: ${{ steps.pub.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p portal/public
          printf '%s\n' "{\"url\":\"${CACHE_URL}\"}" > portal/public/cache-api.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/public/cache-api.json
          if git diff --staged --quiet; then
            echo "cache-api.json unchanged"
          else
            git commit -m "chore: refresh cache-api.json tunnel URL"
            git push
            echo "Updated portal/public/cache-api.json"
          fi
          # Best-effort bake-time var (may 403 without admin PAT — runtime JSON is source of truth)
          gh variable set VITE_CACHE_API --repo "${{ github.repository }}" --body "$CACHE_URL" || true
          gh workflow run pages.yml --repo "${{ github.repository }}" || true
