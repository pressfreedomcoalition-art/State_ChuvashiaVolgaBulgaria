name: Deploy CHV cache

# Own State VPS only (cache-server). Frontend stays on GitHub Pages.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type OWN_VPS to publish cache-server"
        required: true
        default: ""
      cache_host:
        description: "Public cache hostname for nginx/TLS (A → this VPS)"
        required: true
        default: "cache.chv.blc.cab"

jobs:
  deploy:
    if: github.event.inputs.confirm == 'OWN_VPS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NEW_SSH }}

      - name: Publish cache-server to own VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          NEW_PASS: ${{ secrets.NEW_PASS }}
          CACHE_HOST: ${{ github.event.inputs.cache_host }}
        run: |
          set -euo pipefail
          HOST="${SSH_HOST:?set secret SSH_HOST}"
          USER_="${SSH_USER:?set secret SSH_USER}"
          PORT="${SSH_PORT:-22}"
          SSH_BASE=(-p "$PORT" -o StrictHostKeyChecking=accept-new)
          SSH=(ssh "${SSH_BASE[@]}" -o BatchMode=yes)
          SCP=(scp -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)

          # Prefer login user; if no passwordless/password sudo, fall back to root (key or NEW_PASS).
          DEPLOY_USER="$USER_"
          if "${SSH[@]}" "${USER_}@${HOST}" "sudo -n true" 2>/dev/null; then
            echo "Using ${USER_} with passwordless sudo"
          elif "${SSH[@]}" "${USER_}@${HOST}" "sudo -S -p '' true" <<<"$NEW_PASS" 2>/dev/null; then
            echo "Using ${USER_} with sudo via NEW_PASS"
          elif "${SSH[@]}" "root@${HOST}" "true" 2>/dev/null; then
            echo "Using root via NEW_SSH key"
            DEPLOY_USER=root
          else
            sudo apt-get update -y && sudo apt-get install -y sshpass
            export SSHPASS="$NEW_PASS"
            if sshpass -e ssh "${SSH_BASE[@]}" -o PreferredAuthentications=password -o PubkeyAuthentication=no \
              "root@${HOST}" "true"; then
              echo "Using root via NEW_PASS"
              DEPLOY_USER=root
              SSH=(sshpass -e ssh "${SSH_BASE[@]}" -o PreferredAuthentications=password -o PubkeyAuthentication=no)
              SCP=(sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no)
            else
              echo "::error::User ${USER_} has no sudo, and root login (key/password) failed. Add mish to sudoers or enable root SSH."
              exit 1
            fi
          fi

          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          tar -cf "$TMP/bundle.tar" \
            --exclude=node_modules --exclude=data --exclude=.env \
            -C cache-server .

          umask 077
          printf '%s\n' "$NEW_PASS" >"$TMP/chv-sudo.pass"

          "${SCP[@]}" "$TMP/bundle.tar" \
            "$TMP/chv-sudo.pass" \
            deploy/chv-cache.service \
            deploy/chv-cache-warm.service \
            deploy/chv-cache-warm.timer \
            deploy/nginx-cache.chv.example.conf \
            "${DEPLOY_USER}@${HOST}:/tmp/"

          "${SSH[@]}" "${DEPLOY_USER}@${HOST}" env CACHE_HOST="$CACHE_HOST" DEPLOY_USER="$DEPLOY_USER" /bin/bash <<'REMOTE'
          set -euo pipefail
          if [[ "${DEPLOY_USER}" == "root" ]]; then
            SUDO() { "$@"; }
          else
            SUDO() { sudo -S -p '' "$@" < /tmp/chv-sudo.pass; }
          fi
          cleanup() {
            rm -f /tmp/chv-sudo.pass /tmp/bundle.tar \
              /tmp/chv-cache.service /tmp/chv-cache-warm.service \
              /tmp/chv-cache-warm.timer /tmp/nginx-cache.chv.example.conf
          }
          trap cleanup EXIT

          if ! command -v node >/dev/null 2>&1 || ! node -v | grep -qE 'v(2[0-9]|[3-9])'; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | SUDO bash -
            SUDO apt-get install -y nodejs
          fi
          SUDO apt-get update -y
          SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y nginx certbot python3-certbot-nginx

          getent passwd www-data >/dev/null || SUDO useradd -r -s /usr/sbin/nologin www-data

          SUDO install -d -o www-data -g www-data /opt/chv-cache /opt/chv-cache/data
          if [[ -f /opt/chv-cache/.env ]]; then
            SUDO cp -a /opt/chv-cache/.env /tmp/chv-cache.env.bak
          fi
          SUDO tar -xf /tmp/bundle.tar -C /opt/chv-cache
          if [[ -f /tmp/chv-cache.env.bak ]]; then
            SUDO mv /tmp/chv-cache.env.bak /opt/chv-cache/.env
          elif [[ ! -f /opt/chv-cache/.env ]]; then
            printf '%s\n' \
              'PORT=8790' \
              'DAO_ADDRESS=EQDD0Z8_-Anqv5Yww14F-DpzKRaZZdWXgLs1p8c-XyC81Mmx' \
              'CORS_ORIGIN=https://chv.blc.cab,http://localhost:5173' \
              'DATA_DIR=/opt/chv-cache/data' \
              | SUDO tee /opt/chv-cache/.env >/dev/null
          fi
          SUDO bash -c 'cd /opt/chv-cache && npm ci --omit=dev'
          SUDO chown -R www-data:www-data /opt/chv-cache

          SUDO install -m 644 /tmp/chv-cache.service /etc/systemd/system/chv-cache.service
          SUDO install -m 644 /tmp/chv-cache-warm.service /etc/systemd/system/chv-cache-warm.service
          SUDO install -m 644 /tmp/chv-cache-warm.timer /etc/systemd/system/chv-cache-warm.timer

          NGINX_CONF="/etc/nginx/sites-available/${CACHE_HOST}.conf"
          SUDO sed "s/cache.chv.blc.cab/${CACHE_HOST}/g" /tmp/nginx-cache.chv.example.conf | SUDO tee "$NGINX_CONF" >/dev/null
          SUDO ln -sfn "$NGINX_CONF" "/etc/nginx/sites-enabled/${CACHE_HOST}.conf"
          SUDO rm -f /etc/nginx/sites-enabled/default
          SUDO nginx -t
          SUDO systemctl enable --now nginx
          SUDO systemctl reload nginx

          SUDO systemctl daemon-reload
          SUDO systemctl enable --now chv-cache.service
          SUDO systemctl enable --now chv-cache-warm.timer
          SUDO systemctl restart chv-cache.service

          # If we used root, grant mish passwordless sudo for later deploys
          if [[ "${DEPLOY_USER}" == "root" ]] && id mish >/dev/null 2>&1; then
            echo 'mish ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/mish-chv
            chmod 440 /etc/sudoers.d/mish-chv
            visudo -cf /etc/sudoers.d/mish-chv
          fi

          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:8790/health; then
              echo
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8790/health
          echo

          if SUDO certbot --nginx -d "$CACHE_HOST" --non-interactive --agree-tos --register-unsafely-without-email --redirect; then
            curl -fsS "https://${CACHE_HOST}/health" || true
            echo
          else
            echo "::warning::certbot skipped/failed — point A ${CACHE_HOST} → this VPS, then re-run deploy"
          fi

          SUDO systemctl --no-pager is-active chv-cache.service
          SUDO systemctl --no-pager is-active chv-cache-warm.timer
          REMOTE
