# Reverse-proxy: chv.blc.cab → official BLC miniapp (bound-domain hosting).
# DNS for chv must point here (A 137.184.65.1) after GitHub Pages CNAME is removed.
# TLS: certbot --nginx -d chv.blc.cab

upstream chv_dao_upstream {
    # Canon; won.onl is an alternate if RF routing prefers it — change proxy_pass below.
    server dao.blc.cab:443;
}

server {
    listen 80;
    listen [::]:80;
    server_name chv.blc.cab;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chv.blc.cab;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chv.blc.cab;

    # certbot manages these paths after first issue
    ssl_certificate     /etc/letsencrypt/live/chv.blc.cab/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chv.blc.cab/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass https://dao.blc.cab;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name dao.blc.cab;
        proxy_set_header Host dao.blc.cab;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Bound-domain detection uses browser hostname / referrer; keep original host visible to app via header if needed.
        proxy_set_header X-Original-Host $host;
        proxy_redirect https://dao.blc.cab/ /;
        proxy_redirect http://dao.blc.cab/ /;
    }
}
